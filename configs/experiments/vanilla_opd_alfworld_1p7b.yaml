# Original ALFWorld 1.7B budget, with pure OPD and two-device settings.
# Activate an environment and set ATOD_STUDENT_MODEL_PATH/ATOD_TEACHER_MODEL_PATH.
defaults:
  - ppo_trainer
  - _self_
hydra:
  searchpath:
    - file://${oc.env:ATOD_PROJECT_ROOT}/verl/trainer/config
  run:
    dir: ${oc.env:ATOD_BENCHMARK_DIR}/hydra
data:
  train_files: ${oc.env:ATOD_BENCHMARK_DIR}/inputs/train.parquet
  val_files: ${oc.env:ATOD_BENCHMARK_DIR}/inputs/val.parquet
  train_batch_size: 16
  val_batch_size: 128
  max_prompt_length: 2048
  max_response_length: 512
  # Empty control rows only; real observations are supplied by ALFWorld.
  filter_overlong_prompts: false
  filter_overlong_prompts_workers: 1
  dataloader_num_workers: 0
  truncation: error
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: false
actor_rollout_ref:
  model:
    path: ${oc.env:ATOD_STUDENT_MODEL_PATH}
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 4
    ppo_epochs: 1
    use_dynamic_bsz: false
    use_torch_compile: false
    entropy_coeff: 0.0
    use_kl_loss: false
    use_invalid_action_penalty: false
    optim:
      lr: 1.0e-6
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: sync
    dtype: bfloat16
    tensor_model_parallel_size: 2
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    do_sample: true
    seed: 0
    gpu_memory_utilization: 0.5
    enforce_eager: true
    free_cache_engine: true
    enable_chunked_prefill: false
    max_model_len: 2560
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: false
    reuse_weights_across_turns: true
    load_format: dummy_hf
    n: 1
    val_kwargs:
      temperature: 0.4
      do_sample: true
  ref:
    model:
      path: ${oc.env:ATOD_TEACHER_MODEL_PATH}
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  filter_groups:
    enable: false
  sod:
    use_external_teacher: true
    mode: uniform
    opd_only: true
    opd_coef: 1.0
    skill_all: false
env:
  env_name: alfworld/AlfredTWEnv
  seed: 0
  history_length: 2
  max_steps: 50
  rollout:
    n: 8
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0
trainer:
  logger: [console]
  project_name: atod_vanilla_opd_alfworld
  experiment_name: t8b_grpo_s1p7b_2ppu_512_notthinking_150updates
  n_gpus_per_node: 2
  nnodes: 1
  total_training_steps: 150
  total_epochs: 150
  critic_warmup: 0
  val_before_train: true
  test_freq: 5
  save_freq: 10
  max_actor_ckpt_to_keep: 1
  resume_mode: disable
  default_local_dir: ${oc.env:ATOD_BENCHMARK_DIR}/checkpoints
  rollout_data_dir: ${oc.env:ATOD_BENCHMARK_DIR}/rollouts
  validation_data_dir: ${oc.env:ATOD_BENCHMARK_DIR}/validation
  ray_wait_register_center_timeout: 600
ray_init:
  num_cpus: 32
  num_gpus: 2
  include_dashboard: false
  object_store_memory: 2147483648
  _temp_dir: ${oc.env:ATOD_RAY_IPC_DIR}
  _node_ip_address: 127.0.0.1
