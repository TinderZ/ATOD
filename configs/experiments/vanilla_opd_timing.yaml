defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - file:///mnt/data/home/zzr/ATOD/verl/trainer/config
  run:
    dir: ${oc.env:ATOD_BENCHMARK_DIR}/hydra

data:
  train_files: ${oc.env:ATOD_BENCHMARK_DIR}/inputs/train.parquet
  val_files: ${oc.env:ATOD_BENCHMARK_DIR}/inputs/val.parquet
  train_batch_size: 4
  val_batch_size: 4
  max_prompt_length: 2048
  max_response_length: 4096
  # These four offline control rows are prevalidated; actual ALFWorld prompts
  # are constructed and length-checked in the rollout loop. Avoid spawning a
  # datasets Manager socket on CPFS for filtering these placeholder rows.
  filter_overlong_prompts: false
  filter_overlong_prompts_workers: 1
  dataloader_num_workers: 0
  truncation: error
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: true

actor_rollout_ref:
  model:
    path: /mnt/data/share/models/Qwen3-0.6B
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    use_torch_compile: false
    entropy_coeff: 0.0
    use_kl_loss: false
    use_invalid_action_penalty: false
    optim:
      lr: 1.0e-6
      weight_decay: 0.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: sync
    dtype: bfloat16
    tensor_model_parallel_size: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    do_sample: true
    seed: 0
    gpu_memory_utilization: 0.12
    enforce_eager: true
    free_cache_engine: true
    enable_chunked_prefill: false
    max_model_len: 6144
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    reuse_weights_across_turns: true
    load_format: dummy_hf
    n: 1
  ref:
    model:
      path: /mnt/data/home/zzr/models/Qwen3-32B
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  sod:
    use_external_teacher: true
    mode: uniform
    opd_only: true
    opd_coef: 1.0
    skill_all: false

env:
  env_name: alfworld/AlfredTWEnv
  seed: 0
  history_length: 2
  max_steps: 20
  rollout:
    n: 1
  resources_per_worker:
    num_cpus: 0.5
    num_gpus: 0

trainer:
  logger: [console]
  project_name: atod_vanilla_opd_timing
  experiment_name: qwen3_32b_to_0p6b_thinking_4096_2ppu_10updates
  n_gpus_per_node: 2
  nnodes: 1
  total_training_steps: 10
  total_epochs: 10
  critic_warmup: 0
  val_before_train: false
  test_freq: -1
  save_freq: 10
  resume_mode: disable
  default_local_dir: ${oc.env:ATOD_BENCHMARK_DIR}/checkpoints
  rollout_data_dir: ${oc.env:ATOD_BENCHMARK_DIR}/rollouts
  ray_wait_register_center_timeout: 600

ray_init:
  num_cpus: 16
  num_gpus: 2
  include_dashboard: false
  object_store_memory: 2147483648
  _temp_dir: ${oc.env:ATOD_RAY_IPC_DIR,/dev/shm/zzr_opd_pending}
  _node_ip_address: 127.0.0.1
